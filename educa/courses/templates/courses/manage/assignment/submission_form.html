{% extends "base.html" %}

{% block title %}Проверка задания{% endblock %}

{% block content %}
  <h1>Проверка задания {{ object.assignment.title }}</h1>
  <p>Студент: {{ object.student.get_full_name|default:object.student.username }}</p>
  <p><a href="{{ object.file.url }}">Скачать файл</a></p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Сохранить">
  </form>
{% endblock %}
